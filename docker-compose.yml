
name: barber-platform-publishing

services:
  mysql:
    image: mysql:8.4
    container_name: barber-platform-publishing-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: barber_dev_password
      MYSQL_DATABASE: barber_platform
    ports:
      - "3308:3306"
    volumes:
      - barber_mysql_data:/var/lib/mysql
      - type: bind
        source: ./database/schema.sql
        target: /docker-entrypoint-initdb.d/01-schema.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pbarber_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: barber-platform-publishing-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail-preview"]
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"

volumes:
  barber_mysql_data:
